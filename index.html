<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Registo de Tiro</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">

  <meta name="theme-color" content="#1f2b1f">
</head>

<body>

  <h1>Registo de Tiro</h1>

  <p id="estado">A testar ligação...</p>

  <script>
    const API_URL =
      'https://script.google.com/macros/s/AKfycbxEqUE2RZ7BQVGJPdcPkMqjuecN9kdfVzl_9OPDxQvdj8Xnk__mLpv9sU0_lAbcAs3bDA/exec';

   <script>
  const API_URL =
    'https://script.google.com/macros/s/AKfycbxEqUE2RZ7BQVGJPdcPkMqjuecN9kdfVzl_9OPDxQvdj8Xnk__mLpv9sU0_lAbcAs3bDA/exec';

  function respostaTeste(dados) {
    document.getElementById('estado').textContent =
      dados.mensagem;
  }

  const script = document.createElement('script');

  script.src =
    API_URL +
    '?api=teste&callback=respostaTeste';

  script.onerror = function() {
    document.getElementById('estado').textContent =
      'Erro na ligação à API.';
  };

  document.body.appendChild(script);
</script>
<h1>Registo de Tiro</h1>
<p id="estado">A testar ligação...</p>
</body>
</html>
