<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Registo de Tiro</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">

  <meta name="theme-color" content="#1f2b1f">
</head>

<body>

  <h1>Registo de Tiro</h1>
  <p>TESTE JSONP</p>
  <p id="estado">A aguardar resposta...</p>

  <script>
    const API_URL =
      'https://script.google.com/macros/s/AKfycbxEqUE2RZ7BQVGJPdcPkMqjuecN9kdfVzl_9OPDxQvdj8Xnk__mLpv9sU0_lAbcAs3bDA/exec';

    function respostaTeste(dados) {
      document.getElementById('estado').textContent =
        dados.mensagem;
    }

    // Também aceitamos "callback", caso o Apps Script use o nome por defeito.
    function callback(dados) {
      respostaTeste(dados);
    }

    const chamada = document.createElement('script');

    chamada.src =
      API_URL +
      '?api=teste&callback=respostaTeste&t=' +
      Date.now();

    chamada.onerror = function() {
      document.getElementById('estado').textContent =
        'Não foi possível carregar a resposta do Apps Script.';
    };

    document.body.appendChild(chamada);
  </script>

</body>
</html>
